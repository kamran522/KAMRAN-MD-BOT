name: Verify and obfuscate command audit fixes

on:
  push:
    branches:
      - fix/command-audit-20261119

permissions:
  contents: write

jobs:
  verify-and-obfuscate:
    if: "!contains(github.event.head_commit.message, 'obfuscate command fixes')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax and repaired commands before obfuscation
        run: |
          npm run check
          node --test tests/command-audit.test.js
      - name: Install isolated JavaScript obfuscator
        run: npm install --prefix "$RUNNER_TEMP/kamran-obfuscator" --no-audit --no-fund javascript-obfuscator@4.1.1
      - name: Obfuscate changed JavaScript, not config.js
        run: |
          git fetch origin main:refs/remotes/origin/main
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const obfuscator = require(path.join(process.env.RUNNER_TEMP, 'kamran-obfuscator/node_modules/javascript-obfuscator'));
          const files = execFileSync('git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' })
            .trim().split('\n').filter((name) => name.endsWith('.js') && name !== 'config.js').sort();
          const expected = ['plugins/commands.js', 'plugins/message-stats.js', 'plugins/social.js', 'plugins/take.js', 'tests/command-audit.test.js'].sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            throw new Error('Unexpected JS changes: ' + JSON.stringify(files));
          }
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const output = obfuscator.obfuscate(source, {
              target: 'node',
              compact: true,
              identifierNamesGenerator: 'hexadecimal',
              renameGlobals: false,
              renameProperties: false,
              controlFlowFlattening: false,
              deadCodeInjection: false,
              stringArray: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.65,
              simplify: true,
              selfDefending: false,
              debugProtection: false,
              disableConsoleOutput: false,
              sourceMap: false
            }).getObfuscatedCode();
            fs.writeFileSync(file, output + '\n');
          }
          console.log('Obfuscated:', files.join(', '));
          NODE
      - name: Confirm config.js unchanged
        run: git diff origin/main --exit-code -- config.js
      - name: Check syntax after obfuscation
        run: npm run check
      - name: Test repaired commands after obfuscation
        run: node --test tests/command-audit.test.js
      - name: Run existing tests
        run: |
          npm run test:ai
          node --test tests/autodl.test.js tests/spotify-command.test.js tests/youtube-choices.test.js tests/youtube-fragments.test.js tests/temp-sweeper.test.js tests/media-downloads.test.js tests/group-moderation.test.js tests/phone-examples.test.js
      - name: Commit obfuscated sources on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "build: obfuscate command fixes"
          git push origin HEAD
