name: Verify and obfuscate YouTube 144p download fix

on:
  push:
    branches:
      - fix/youtube-144p-fragments-20261119

permissions:
  contents: write

jobs:
  verify-and-obfuscate:
    if: "!contains(github.event.head_commit.message, 'obfuscate 144p fixes')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify syntax before obfuscation
        run: npm run check
      - name: Test YouTube fragment recovery before obfuscation
        run: node --test tests/youtube-fragments.test.js
      - name: Install isolated JavaScript obfuscator
        run: npm install --prefix "$RUNNER_TEMP/kamran-obfuscator" --no-audit --no-fund javascript-obfuscator@4.1.1
      - name: Obfuscate only the affected JavaScript files, excluding config.js
        run: |
          git fetch origin main:refs/remotes/origin/main
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const obfuscator = require(path.join(process.env.RUNNER_TEMP, 'kamran-obfuscator/node_modules/javascript-obfuscator'));
          const files = execFileSync('git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' })
            .trim().split('\n').filter((name) => name.endsWith('.js') && name !== 'config.js').sort();
          const expected = ['core/services.js', 'plugins/youtube.js', 'tests/youtube-fragments.test.js'].sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            throw new Error('Unexpected JavaScript changes: ' + JSON.stringify(files));
          }
          for (const name of files) {
            const source = fs.readFileSync(name, 'utf8');
            const output = obfuscator.obfuscate(source, {
              target: 'node',
              compact: true,
              identifierNamesGenerator: 'hexadecimal',
              renameGlobals: false,
              renameProperties: false,
              controlFlowFlattening: false,
              deadCodeInjection: false,
              stringArray: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.65,
              simplify: true,
              selfDefending: false,
              debugProtection: false,
              disableConsoleOutput: false,
              sourceMap: false
            }).getObfuscatedCode();
            fs.writeFileSync(name, output + '\n');
          }
          console.log('Obfuscated:', files.join(', '));
          NODE
      - name: Check config.js unchanged
        run: git diff origin/main --exit-code -- config.js
      - name: Check syntax after obfuscation
        run: npm run check
      - name: Test YouTube fragment recovery after obfuscation
        run: node --test tests/youtube-fragments.test.js
      - name: Run YouTube quality and temporary cleanup tests
        run: node --test tests/youtube-choices.test.js tests/temp-sweeper.test.js
      - name: Run downloader tests
        run: node --test tests/media-downloads.test.js
      - name: Run AI tests
        run: npm run test:ai
      - name: Run group moderation tests
        run: node --test tests/group-moderation.test.js
      - name: Run Spotify tests to detect regressions
        run: node --test tests/spotify-command.test.js
      - name: Commit obfuscated sources on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "build: obfuscate 144p fixes"
          git push origin HEAD
