name: Verify and obfuscate Baileys status compatibility

on:
  push:
    branches:
      - fix/baileys-status-stanza-20261119

permissions:
  contents: write

jobs:
  verify-and-obfuscate:
    if: "!contains(github.event.head_commit.message, 'obfuscate status compatibility')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository syntax and status compatibility tests
        run: |
          npm run check
          node --test tests/baileys-status-compat.test.js tests/uptime-settings-status.test.js
      - name: Check compatibility against actual pinned Baileys 7.0.0-rc14
        run: |
          mkdir -p "$RUNNER_TEMP/baileys-rc14"
          curl -fsSL --retry 3 "https://registry.npmjs.org/baileys/-/baileys-7.0.0-rc14.tgz" \
            -o "$RUNNER_TEMP/baileys-rc14.tgz"
          tar -xzf "$RUNNER_TEMP/baileys-rc14.tgz" -C "$RUNNER_TEMP/baileys-rc14"
          node <<'NODE'
          const path = require('path');
          const assert = require('node:assert/strict');
          const { patchBaileysStatusStanzas } = require('./scripts/patch-baileys-status');
          const filename = path.join(process.env.RUNNER_TEMP, 'baileys-rc14/package/lib/Socket/messages-recv.js');
          const result = patchBaileysStatusStanzas({ filename });
          console.log('Actual rc14 compatibility:', result.status, result.message || '');
          assert.equal(result.status, 'patched', 'rc14 receive module must match known patch structure');
          assert.equal(patchBaileysStatusStanzas({ filename }).status, 'already-patched');
          NODE
      - name: Install isolated JavaScript obfuscator
        run: npm install --prefix "$RUNNER_TEMP/kamran-obfuscator" --no-audit --no-fund javascript-obfuscator@4.1.1
      - name: Obfuscate only affected JavaScript excluding config.js
        run: |
          git fetch origin main:refs/remotes/origin/main
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const obfuscator = require(path.join(process.env.RUNNER_TEMP, 'kamran-obfuscator/node_modules/javascript-obfuscator'));
          const files = execFileSync('git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' })
            .trim().split('\n').filter((name) => name.endsWith('.js') && name !== 'config.js').sort();
          const expected = [
            'core/helpers.js',
            'scripts/patch-baileys-status.js',
            'tests/baileys-status-compat.test.js',
          ].sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            throw new Error('Unexpected modified JS: ' + JSON.stringify(files));
          }
          for (const filename of files) {
            const original = fs.readFileSync(filename, 'utf8');
            const output = obfuscator.obfuscate(original, {
              target: 'node',
              compact: true,
              identifierNamesGenerator: 'hexadecimal',
              renameGlobals: false,
              renameProperties: false,
              controlFlowFlattening: false,
              deadCodeInjection: false,
              stringArray: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.65,
              simplify: true,
              selfDefending: false,
              debugProtection: false,
              disableConsoleOutput: false,
              sourceMap: false,
            }).getObfuscatedCode();
            fs.writeFileSync(filename, output + '\n');
          }
          console.log('Obfuscated:', files.join(', '));
          NODE
      - name: Confirm config.js unchanged
        run: git diff origin/main --exit-code -- config.js
      - name: Syntax and status tests after obfuscation
        run: |
          npm run check
          node --test tests/baileys-status-compat.test.js tests/uptime-settings-status.test.js
      - name: Confirm obfuscated patch still works on real Baileys
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const assert = require('node:assert/strict');
          const { patchBaileysStatusStanzas } = require('./scripts/patch-baileys-status');
          const original = path.join(process.env.RUNNER_TEMP, 'baileys-rc14/package/lib/Socket/messages-recv.js.kamran-status-original');
          const filename = path.join(process.env.RUNNER_TEMP, 'baileys-rc14/package/lib/Socket/messages-recv.js');
          fs.copyFileSync(original, filename);
          assert.equal(patchBaileysStatusStanzas({ filename }).status, 'patched');
          NODE
      - name: Run existing regression suites
        run: |
          npm run test:ai
          node --test tests/autodl.test.js tests/spotify-command.test.js tests/youtube-choices.test.js tests/youtube-fragments.test.js tests/temp-sweeper.test.js tests/media-downloads.test.js tests/group-moderation.test.js tests/phone-examples.test.js tests/command-audit.test.js
      - name: Commit obfuscated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "build: obfuscate status compatibility"
          git push origin HEAD
