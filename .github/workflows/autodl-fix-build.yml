name: Verify and obfuscate AutoDL fixes

on:
  push:
    branches:
      - fix/autodl-links-and-media-20261119

permissions:
  contents: write

jobs:
  verify-and-obfuscate:
    if: "!contains(github.event.head_commit.message, 'obfuscate AutoDL fixes')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source syntax
        run: npm run check
      - name: Test AutoDL before obfuscation
        run: node --test tests/autodl.test.js
      - name: Install isolated JavaScript obfuscator
        run: npm install --prefix "$RUNNER_TEMP/kamran-obfuscator" --no-audit --no-fund javascript-obfuscator@4.1.1
      - name: Obfuscate changed JavaScript, excluding config.js
        run: |
          git fetch origin main:refs/remotes/origin/main
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const obfuscator = require(path.join(process.env.RUNNER_TEMP, 'kamran-obfuscator/node_modules/javascript-obfuscator'));
          const files = execFileSync('git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' })
            .trim().split('\n').filter((name) => name.endsWith('.js') && name !== 'config.js').sort();
          const expected = ['plugins/autodl.js', 'tests/autodl.test.js'];
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            throw new Error('Unexpected modified JavaScript files: ' + JSON.stringify(files));
          }
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const output = obfuscator.obfuscate(source, {
              target: 'node',
              compact: true,
              identifierNamesGenerator: 'hexadecimal',
              renameGlobals: false,
              renameProperties: false,
              controlFlowFlattening: false,
              deadCodeInjection: false,
              stringArray: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.65,
              simplify: true,
              selfDefending: false,
              debugProtection: false,
              disableConsoleOutput: false,
              sourceMap: false
            }).getObfuscatedCode();
            fs.writeFileSync(file, output + '\n');
          }
          console.log('Obfuscated:', files.join(', '));
          NODE
      - name: Verify config.js unchanged
        run: git diff origin/main --exit-code -- config.js
      - name: Verify syntax after obfuscation
        run: npm run check
      - name: Test AutoDL after obfuscation
        run: node --test tests/autodl.test.js
      - name: Test YouTube regression suites
        run: node --test tests/youtube-choices.test.js tests/youtube-fragments.test.js tests/temp-sweeper.test.js
      - name: Test downloader services
        run: node --test tests/media-downloads.test.js
      - name: Test AI commands
        run: npm run test:ai
      - name: Test group moderation
        run: node --test tests/group-moderation.test.js
      - name: Test Spotify command
        run: node --test tests/spotify-command.test.js
      - name: Commit obfuscated AutoDL sources on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "build: obfuscate AutoDL fixes"
          git push origin HEAD
