name: JavaScript syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test AI providers without network access
        run: node --test tests/ai-provider.test.js
      - name: Test downloader services without network access
        run: node --test tests/media-downloads.test.js
