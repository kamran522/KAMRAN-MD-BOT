name: JavaScript syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test WhatsApp Business pairing configuration
        run: node --test tests/whatsapp-business-link.test.js
      - name: Test local AI without network access
        run: npm run test:ai
      - name: Test downloader services without network access
        run: node --test tests/media-downloads.test.js
      - name: Test Spotify metadata and command flow
        run: node --test tests/spotify-command.test.js
      - name: Test YouTube quality replies and temporary download cleanup
        run: node --test tests/youtube-choices.test.js tests/temp-sweeper.test.js
      - name: Test 144p YouTube fragment recovery
        run: node --test tests/youtube-fragments.test.js
      - name: Test AutoDL link detection and media uploads
        run: node --test tests/autodl.test.js
      - name: Test example phone numbers in command help
        run: node --test tests/phone-examples.test.js
      - name: Test repaired command handlers
        run: node --test tests/command-audit.test.js
      - name: Test uptime, status reads and settings replies
        run: node --test tests/uptime-settings-status.test.js
      - name: Test Baileys status stanza compatibility
        run: node --test tests/baileys-status-compat.test.js
      - name: Test X/Twitter downloads and command handlers
        run: node --test tests/twitter-download.test.js tests/twitter-commands.test.js
      - name: Test licensed movie search and downloads
        run: node --test tests/movies-catalog.test.js tests/movie-command.test.js
      - name: Test group moderation without WhatsApp network access
        run: node --test tests/group-moderation.test.js
